name: Keep API warm

# Render's free tier puts the API to sleep after 15 minutes without a request, and
# waking it makes sign-in take about a minute. Pinging every 10 minutes keeps it
# awake during working hours. Not around the clock: free instance hours (750 a month)
# are shared across the Render account with the GlowCart site, so the two schedules
# together are kept under that limit.
on:
  schedule:
    # Every 10 minutes, 07:00-17:00 South African time (UTC+2), Monday to Friday
    - cron: '*/10 5-14 * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        # --max-time covers a cold start, so a sleeping API is woken, not just poked
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://moderntech-hr-api.onrender.com/health
